# fly.toml app configuration file generated for safibre-sn-muddy-fire-5764 on 2024-08-28T18:01:42+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'safibre-sn-muddy-fire-5764'
primary_region = 'jnb'
console_command = 'php /var/www/html/artisan tinker'

[build]
  [build.args]
    NODE_VERSION = '18'
    PHP_VERSION = '8.2'

[env]
  APP_ENV = 'production'
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'info'
  LOG_STDERR_FORMATTER = 'Monolog\Formatter\JsonFormatter'
  SESSION_DRIVER = 'cookie'
  SESSION_SECURE_COOKIE = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/up"
    protocol = "http"
    port = 8080
    timeout = "2s"
    tls_skip_verify = false


[deploy]
    # strategy = "bluegreen"

[mounts]
    source="storage"
    destination="/var/www/html/storage"


[[vm]]
  size = 'shared-cpu-1x'
  memory = '0.5gb'
  cpu_kind = 'shared'
  cpus = 1
